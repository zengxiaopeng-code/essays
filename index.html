<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜话晓言 · 曾晓鹏文集</title>
<meta name="description" content="夜话晓言 —— 曾晓鹏的文集。入夜成话，及晓成言；陆续收存我写下的推演、随笔与一些把事情想透的尝试。">
<style>
  :root{
    --paper:#EBEDEC;
    --paper-deep:#E3E5E3;
    --ink:#17191A;
    --ink-soft:#2C3032;
    --oxblood:#7A2A20;
    --oxblood-soft:#9A4034;
    --slate:#565B5E;
    --slate-faint:#8A8F90;
    --hair:#C8CBC8;
    --serif: Georgia, "Times New Roman", "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Heiti SC", "Helvetica Neue", Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:18px;
    line-height:1.95;
    letter-spacing:.01em;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:104px 28px 140px;
    animation:rise .9s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.wrap{animation:none;}}

  /* ---- masthead ---- */
  .eyebrow{
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--oxblood);
    margin:0 0 24px;
    font-weight:600;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:18px;
    margin:0 0 18px;
  }
  .seal{
    flex:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:56px;height:56px;
    background:var(--oxblood);
    color:var(--paper);
    font-family:var(--serif);
    font-weight:700;
    font-size:32px;
    line-height:1;
    border-radius:4px;
    transform:rotate(-4deg);
    user-select:none;
  }
  .wordmark{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(38px,7.5vw,60px);
    letter-spacing:.16em;
    line-height:1.05;
    margin:0;
    color:var(--ink);
  }
  .byline{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin:0 0 18px;
  }
  .by-tag{
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--oxblood);
    font-weight:600;
  }
  .by-name{
    font-family:var(--serif);
    font-size:18px;
    letter-spacing:.24em;
    color:var(--ink);
  }
  .epi{
    font-style:italic;
    color:var(--slate);
    border-left:2px solid var(--oxblood);
    padding:2px 0 2px 16px;
    margin:0 0 22px;
    font-size:17px;
    line-height:1.8;
  }
  .deck{
    font-size:18px;
    color:var(--ink-soft);
    line-height:1.85;
    margin:0;
    max-width:32em;
  }
  .intro{
    border-bottom:1px solid var(--hair);
    padding-bottom:46px;
  }

  /* ---- archive ---- */
  .sec-eyebrow{
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--slate);
    font-weight:600;
    margin:54px 0 4px;
    display:flex;align-items:center;gap:14px;
  }
  .sec-eyebrow::after{content:"";flex:1;height:1px;background:var(--hair);}

  .entries{list-style:none;margin:0;padding:0;}
  .entry{border-bottom:1px solid var(--hair);}
  .entry-link{
    display:block;
    text-decoration:none;
    color:inherit;
    padding:34px 2px;
    transition:padding-left .25s ease;
  }
  .entry-link:hover{padding-left:14px;}
  .entry-no{
    font-family:var(--sans);
    font-size:12px;
    font-weight:700;
    letter-spacing:.12em;
    color:var(--oxblood);
    display:block;
    margin-bottom:12px;
  }
  .entry-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(23px,4vw,28px);
    line-height:1.34;
    margin:0 0 12px;
    color:var(--ink);
    transition:color .2s ease;
  }
  .entry-link:hover .entry-title{color:var(--oxblood);}
  .entry-title .dash{color:var(--oxblood-soft);font-weight:400;padding:0 .15em;}
  .entry-deck{
    font-size:17px;
    color:var(--ink-soft);
    line-height:1.8;
    margin:0 0 16px;
    max-width:34em;
  }
  .entry-meta{
    font-family:var(--sans);
    font-size:12.5px;
    letter-spacing:.06em;
    color:var(--slate-faint);
    margin:0;
    display:flex;flex-wrap:wrap;gap:6px 18px;
    align-items:baseline;
  }
  .entry-meta .read{color:var(--oxblood);margin-left:auto;}

  /* ---- footer ---- */
  .site-foot{
    margin-top:74px;
    font-family:var(--sans);
    font-size:12.5px;
    letter-spacing:.06em;
    color:var(--slate-faint);
    line-height:1.8;
  }

  @media (max-width:640px){
    body{font-size:17px;}
    .wrap{padding:64px 20px 100px;}
    .intro{padding-bottom:36px;}
    .seal{width:48px;height:48px;font-size:27px;}
    .wordmark{letter-spacing:.12em;}
    .entry-meta .read{margin-left:0;width:100%;}
  }
</style>
</head>
<body>
<main class="wrap">

  <header class="intro">
    <p class="eyebrow">随笔 · Essays</p>
    <div class="logo">
      <span class="seal" aria-hidden="true">晓</span>
      <h1 class="wordmark">夜话晓言</h1>
    </div>
    <p class="byline"><span class="by-tag">文</span><span class="by-name">曾晓鹏</span></p>
    <p class="epi">入夜成话，及晓成言。</p>
    <p class="deck">这里陆续收存我写下的文字 —— 推演、随笔，与一些把事情想透的尝试。</p>
  </header>

  <p class="sec-eyebrow">文章</p>
  <ol class="entries">

    <li class="entry">
      <a class="entry-link" href="dengshuikai.html">
        <span class="entry-no">01</span>
        <h2 class="entry-title">等水开<span class="dash">—</span>债务临界、美元换锚与一场结构性萧条</h2>
        <p class="entry-deck">把美元体系的再锚定，从一串可被估算概率的事件，还原为一条由结构逼出的必经之路。</p>
        <p class="entry-meta"><span>2026</span><span>货币体系 · 主权债务 · 能源</span><span class="read">阅读 →</span></p>
      </a>
    </li>

  </ol>

  <footer class="site-foot">
    <p>© 2026 夜话晓言 · 曾晓鹏</p>
  </footer>

</main>
</body>
</html>
